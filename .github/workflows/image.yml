name: Image Build

on:
  workflow_dispatch:
    inputs:
      AZURE_LOCATION:
        description: "Azure region"
        type: string
        required: true
        default: "eastus"

      SECURITY_TYPE:
        description: "VM security type"
        type: choice
        required: true
        default: "ConfidentialVM"
        options:
          - Standard
          - TrustedLaunch
          - ConfidentialVM

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: write
jobs:
  prep:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4

    - name: Setup Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
      with:
        go-version: 1.24.x

    - name: Build Attestation Client + Server
      run: |
        cd attest
        go get ./...
        go build -o ../build-azure ./...

    - name: Upload image attestation tool
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: image-attestation
        path: build-azure/image-attestation

  maa:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
      with:
        repository: Azure/confidential-computing-cvm-guest-attestation

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install build-essential libcurl4-openssl-dev libjsoncpp-dev libboost-all-dev cmake nlohmann-json3-dev
        curl -LO https://packages.microsoft.com/repos/azurecore/pool/main/a/azguestattestation1/azguestattestation1_1.1.2_amd64.deb
        sudo dpkg -i azguestattestation1_1.1.2_amd64.deb

    - name: Build MAA Client
      run: |
        cd cvm-attestation-sample-app
        cmake .
        make

    - name: Upload guest attestation tool
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: guest-attestation
        path: cvm-attestation-sample-app/AttestationClient

  efitools:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
      with:
        repository: vathpela/efitools

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install gnu-efi libfile-slurp-perl

    - name: Build hash-to-efi-sig-list
      run: |
        make hash-to-efi-sig-list

    - name: Upload hash-to-efi-sig-list
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: hash-to-efi-sig-list
        path: ./hash-to-efi-sig-list

  image:
    needs: [prep,maa,efitools]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4

    - name: Download image attestation tool
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: image-attestation
        path: build-azure

    - name: Download azure attestation tool
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: guest-attestation
        path: build-azure

    - name: Download hash-to-efi-sig-list tool
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: hash-to-efi-sig-list
        path: build-azure

    - name: Login to Azure
      uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Build Azure VM
      env:
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        AZURE_LOCATION: ${{ inputs.AZURE_LOCATION }}
        AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        AZURE_GALLERY_NAME: ${{ secrets.AZURE_VM_NAME }}_gallery
        AZURE_IMAGE_DEFINITION: ${{ secrets.AZURE_VM_NAME }}_image
        AZURE_IMAGE_VERSION: 0.0.${{ github.run_number }}
        SSH_KEYS_URL: https://github.com/${{ github.actor }}.keys
      run: |
        build-azure/build.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: image
        path: uki.efi

    - name: Generate provenance
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a #v3
      with:
        subject-path: uki.efi

  attest:
    needs: [image]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4

    - name: Login to Azure
      uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Attesting Azure VM
      env:
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        AZURE_LOCATION: ${{ inputs.AZURE_LOCATION }}
        AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        AZURE_GALLERY_NAME: ${{ secrets.AZURE_VM_NAME }}_gallery
        AZURE_IMAGE_DEFINITION: ${{ secrets.AZURE_VM_NAME }}_image
        SECURITY_TYPE: ${{ inputs.SECURITY_TYPE }}
      run: |
        build-azure/attest.sh
